# SwiftLint конфигурация SmartSwitcher (ТЗ 16)
included:
  - Sources
  - Tests

excluded:
  - .build
  - Sources/SmartSwitcherKit/Resources

analyzer_rules:
  - unused_declaration
  - unused_import

opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - force_unwrapping
  - redundant_nil_coalescing
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 600
  error: 900
  ignore_comment_only_lines: true

function_body_length:
  warning: 80
  error: 140

cyclomatic_complexity:
  warning: 15
  error: 25

identifier_name:
  min_length: 2
  excluded: [id, n, x, y, s, e, d, ch, to]

force_unwrapping:
  severity: warning

# Файлы словарей/локализаций не лимитируем (это данные).
disabled_rules:
  - todo
