name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build (release)
        run: swift build -c release

      - name: Checks (unit + детекторные метрики + бенчмарк)
        run: swift run -c release SmartSwitcherChecks

      - name: Integration (реальный движок + перенабор)
        run: swift run -c release SmartSwitcherIntegration

      - name: Bundle
        run: make bundle

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartSwitcher.app
          path: dist/SmartSwitcher.app

  lint:
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: SwiftLint
        run: |
          brew install swiftlint
          swiftlint --strict || true
